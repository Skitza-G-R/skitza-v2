<meta charset="utf-8">
<title>Skitza Teaser</title>
<style>
@font-face{font-family:Syne;src:url(fonts/Syne.woff2)format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:Outfit;src:url(fonts/Outfit.woff2)format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:JBMono;src:url(fonts/JetBrainsMono.woff2)format("woff2");font-weight:100 900;font-display:block}

:root{
  --bg-background:242 237 230; --bg-elevated:255 255 255; --bg-sidebar:17 16 9;
  --bg-overlay:247 243 235;    --bg-sunken:232 225 212;
  --fg-default:17 16 9; --fg-secondary:61 55 48; --fg-muted:107 99 89; --fg-faint:156 148 138;
  --fg-inverse:242 237 230;
  --fg-success:34 197 94; --fg-danger:220 38 38; --fg-warning:245 158 11;
  --fg-success-text:15 105 50; --fg-warning-text:128 76 0;
  --brand-primary:212 150 10; --brand-primary-dark:161 113 6; --brand-copper:176 104 48;
  --fg-on-brand:26 20 7;
  --border-subtle:232 225 212; --border-strong:200 192 178; --border-sidebar:40 38 35;
  --kind-tracking:212 150 10; --kind-mix:124 58 237; --kind-master:14 165 233;
  --kind-intro:16 185 129; --kind-songwriting:236 72 153;
  --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-xl:20px; --radius-card:18px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
html,body{background:#000;overflow:hidden}
#stage{position:relative;overflow:hidden;background:rgb(var(--bg-background));
  font-family:Outfit,system-ui,sans-serif;color:rgb(var(--fg-default))}

/* ---------- scene plumbing ---------- */
.scene{position:absolute;inset:0;will-change:transform,opacity}
.dark{background:rgb(var(--bg-sidebar));color:rgb(var(--fg-inverse))}

/* ---------- primitives ---------- */
.card{background:rgb(var(--bg-elevated));border:1px solid rgb(var(--border-subtle));
  border-radius:var(--radius-card);box-shadow:0 1px 2px rgb(120 100 70/.06),0 18px 40px -18px rgb(90 72 44/.28)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;
  font-family:Outfit;font-weight:600;border:0;white-space:nowrap}
.btn-primary{background:rgb(var(--brand-primary));color:rgb(var(--fg-on-brand))}
.btn-ghost{background:rgb(var(--bg-sunken));color:rgb(var(--fg-secondary))}
.chip{display:inline-flex;align-items:center;gap:.45em;font-weight:600;
  border-radius:999px;white-space:nowrap}
.mono{font-family:JBMono,monospace;font-variant-ligatures:none}
.disp{font-family:Syne,system-ui,sans-serif;font-weight:800;letter-spacing:-.02em}

/* dot / avatar / play = square elements, rounded-full is legitimate here */
.dot{border-radius:999px;flex:none}
.avatar{border-radius:999px;display:grid;place-items:center;font-family:Syne;font-weight:800;flex:none}

/* ---------- app chrome ---------- */
.win{position:absolute;background:rgb(var(--bg-elevated));border-radius:var(--radius-xl);
  overflow:hidden;border:1px solid rgb(var(--border-subtle));
  box-shadow:0 2px 4px rgb(120 100 70/.05),0 40px 80px -30px rgb(70 55 30/.38)}
.topbar{height:var(--tb);background:rgb(var(--bg-overlay));border-bottom:1px solid rgb(var(--border-subtle));
  display:flex;align-items:center;gap:10px;padding:0 18px}
.urlpill{flex:1;height:calc(var(--tb) - 22px);background:rgb(var(--bg-elevated));
  border:1px solid rgb(var(--border-subtle));border-radius:999px;display:flex;align-items:center;
  padding:0 16px;color:rgb(var(--fg-muted));gap:8px}
.side{position:absolute;left:0;top:0;bottom:0;background:rgb(var(--bg-sidebar));
  border-right:1px solid rgb(var(--border-sidebar));color:rgb(var(--fg-inverse))}
.navitem{display:flex;align-items:center;gap:12px;border-radius:var(--radius-md);
  color:rgb(200 193 182);font-weight:500}
.navitem.on{background:rgb(255 255 255/.08);color:rgb(var(--fg-inverse))}

/* ---------- cursor ---------- */
#cursor{position:absolute;width:0;height:0;z-index:60;pointer-events:none}
#cursor svg{position:absolute;left:-3px;top:-2px;filter:drop-shadow(0 3px 7px rgb(0 0 0/.35))}
.ripple{position:absolute;border-radius:999px;border:3px solid rgb(var(--brand-primary));
  transform:translate(-50%,-50%);pointer-events:none;z-index:59}

/* ---------- caption ---------- */
#capwrap{display:none!important;position:absolute;z-index:70;display:flex;flex-direction:column;align-items:flex-start}
#cap{font-family:Syne;font-weight:800;letter-spacing:-.025em;color:rgb(var(--fg-default));line-height:1.08}
#capbar{background:rgb(var(--brand-primary));border-radius:999px;height:6px;flex:none}

/* ---------- fx ---------- */
#grain{position:absolute;inset:0;z-index:80;pointer-events:none;opacity:.055;
  background-image:var(--grain);background-size:180px 180px;mix-blend-mode:multiply}
#vig{position:absolute;inset:0;z-index:79;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgb(60 44 20/.20) 100%)}
#wipe{display:none!important;position:absolute;z-index:85;background:rgb(var(--brand-primary));pointer-events:none}
#flash{position:absolute;inset:0;z-index:86;background:#fff;pointer-events:none;opacity:0}
</style>

<div id="stage">
  <div id="scenes"></div>
  <div id="capwrap"><div id="capbar"></div><div id="cap"></div></div>
  <div id="cursor"><svg width="30" height="38" viewBox="0 0 30 38">
    <path d="M3 2 L3 27.5 L9.6 21.4 L14.2 32.6 L18.9 30.6 L14.4 19.7 L23.4 19.2 Z"
          fill="#fff" stroke="#111009" stroke-width="2.1" stroke-linejoin="round"/></svg></div>
  <div id="vig"></div><div id="grain"></div><div id="wipe"></div><div id="flash"></div>
</div>

<script src="scenes-v3.js"></script>
<script>
/* ============ deterministic engine ============
   Nothing here uses wall-clock time or CSS animation.
   Every visual is a pure function of t, so a frame is
   identical no matter how slow the container is.       */
const E = {
  lin:  t => t,
  out:  t => 1 - Math.pow(1 - t, 3),
  outQ: t => 1 - Math.pow(1 - t, 4),
  in:   t => t * t * t,
  io:   t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2,
  back: t => { const c = 1.70158 + 1; return 1 + c*Math.pow(t-1,3) + 1.70158*Math.pow(t-1,2); },
  // damped spring — for anything that should feel physical rather than mechanical
  spring: t => t >= 1 ? 1 : 1 - Math.pow(2, -10*t) * Math.cos((t*10 - .75) * (2*Math.PI/3)),
};
const clamp = (v,a=0,b=1) => v < a ? a : v > b ? b : v;
const lerp  = (a,b,u) => a + (b-a)*u;
// normalized progress of [s, s+d] at time t, through easing fn
const P = (t,s,d,f=E.out) => f(clamp((t-s)/d));
// symmetric in/out envelope
const pulse = (t,s,d,rise=.18,fall=.18) => {
  const u = clamp((t-s)/d); if (u<=0||u>=1) return 0;
  return Math.min(E.out(clamp((t-s)/rise)), E.out(clamp((s+d-t)/fall)));
};
const px = v => typeof v === 'number' ? v.toFixed(2) + 'px' : v;  // strings (e.g. '9px 18px') pass through

let MODE='wide', W=1920, H=1080, SC=1, TL=null, SCENES=[], CUR=null;

function setCursor(x,y,show=1,scale=1){
  const c=document.getElementById('cursor');
  c.style.transform=`translate(${px(x)},${px(y)}) scale(${scale})`;
  c.style.opacity=show;
}
// cursor travels a polyline; returns eased position at local time
function cursorPath(pts, lt){
  if(lt<=pts[0].t) return pts[0];
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i], b=pts[i+1];
    if(lt>=a.t && lt<=b.t){
      const u=E.io(clamp((lt-a.t)/(b.t-a.t)));
      return {x:lerp(a.x,b.x,u), y:lerp(a.y,b.y,u)};
    }
  }
  return pts[pts.length-1];
}
function ripple(el, lt, at, size=110){
  const u = clamp((lt-at)/.55);
  if(u<=0||u>=1){ el.style.opacity=0; return; }
  el.style.opacity = (1-u)*.85;
  const s = size*(0.25+u*1.0);
  el.style.width=px(s); el.style.height=px(s);
  el.style.borderWidth=px(Math.max(1,3.2*(1-u)));
}

window.__build = function(mode){
  MODE = mode;
  W = mode==='wide' ? 1920 : 1080;
  H = mode==='wide' ? 1080 : 1920;
  SC = mode==='wide' ? 1 : 1;
  const st=document.getElementById('stage');
  st.style.width=W+'px'; st.style.height=H+'px';
  document.body.style.width=W+'px'; document.body.style.height=H+'px';

  // procedural grain so the flat cream never looks like dead vector fill
  const g=document.createElement('canvas'); g.width=g.height=180;
  const gx=g.getContext('2d'), im=gx.createImageData(180,180);
  let seed=99; const rnd=()=>((seed=(seed*1664525+1013904223)>>>0)/4294967296);
  for(let i=0;i<im.data.length;i+=4){ const v=200+rnd()*55;
    im.data[i]=im.data[i+1]=im.data[i+2]=v; im.data[i+3]=255; }
  gx.putImageData(im,0,0);
  st.style.setProperty('--grain',`url(${g.toDataURL()})`);

  TL = window.__TIMELINE;
  const host=document.getElementById('scenes');
  SCENES = TL.beats.map(b => {
    const el=document.createElement('div');
    el.className='scene'; el.dataset.id=b.id; host.appendChild(el);
    const build = window.SCENE_BUILDERS[b.id];
    const update = build ? build(el, {mode, W, H, E, clamp, lerp, P, pulse, px, cursorPath, setCursor, ripple}) : ()=>{};
    return {...b, el, update};
  });
  return {W,H,total: TL.beats.reduce((m,b)=>Math.max(m,b.start+b.dur),0)};
};

window.__render = function(t){
  const cap=document.getElementById('cap'), capbar=document.getElementById('capbar');
  let capText='', capA=0;
  window.__capOverride = null;   // a scene may claim its own caption placement
  setCursor(-99,-99,0);

  for(const s of SCENES){
    const lt = t - s.start;
    const active = lt >= -0.001 && lt < s.dur;
    s.el.style.display = active ? 'block' : 'none';
    if(!active) continue;

    // fast-cut envelope: hard in, quick settle, quick out
    const inU  = P(t, s.start, .34, E.outQ);
    const outU = clamp((t - (s.start+s.dur-.22))/.22);
    s.el.style.opacity = clamp(inU*1.0) * (1-outU);
    s.el.style.transform = `scale(${lerp(1.035,1,inU) * lerp(1,0.985,outU)})`;

    s.update(lt, s.dur, t);

    if(s.caption){
      capText = s.caption;
      capA = Math.min(P(t, s.start+.30, .42, E.out), 1-clamp((t-(s.start+s.dur-.30))/.30));
    }
  }

  // caption — anchored at its baseline so a two-line caption grows upward
  if(capText){
    if(cap.textContent!==capText) cap.textContent=capText;
    const wide = MODE==='wide';
    const wrap = document.getElementById('capwrap');
    const ov = window.__capOverride;
    if(ov){                              // side-by-side layout (phone beats)
      wrap.style.left = px(ov.left); wrap.style.width = px(ov.width);
      wrap.style.bottom = 'auto';    wrap.style.top = px(ov.top);
    } else {
      wrap.style.left = px(wide?150:88); wrap.style.width = px(wide?1220:904);
      wrap.style.top = 'auto';       wrap.style.bottom = px(wide?92:250);
    }
    wrap.style.opacity= capA;
    wrap.style.transform = `translateY(${px(lerp(18,0,capA))})`;
    cap.style.fontSize   = px(window.__capOverride ? 52 : (wide?46:54));
    cap.style.marginTop  = px(wide?24:28);
    capbar.style.width   = px(lerp(0,86,capA));
  } else { document.getElementById('capwrap').style.opacity=0; }

  // amber wipe on each cut (sells the "fast cut" rhythm)
  const wipe=document.getElementById('wipe');
  let wa=0, wy=0;
  for(const s of SCENES){
    if(s.start===0) continue;
    const u=clamp((t-(s.start-.16))/.34);
    if(u>0&&u<1){ wa=1; wy=u; }
  }
  if(wa){
    const u=wy;
    // a band that sweeps across and off
    const bw=W*0.62;
    wipe.style.opacity=1;
    wipe.style.top='0px'; wipe.style.height=H+'px';
    wipe.style.width=px(bw);
    wipe.style.left=px(lerp(-bw, W, E.io(u)));
    wipe.style.transform='skewX(-9deg)';
  } else wipe.style.opacity=0;
};
</script>

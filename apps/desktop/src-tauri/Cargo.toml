[package]
name = "skitza-desktop"
version = "0.1.0"
description = "Skitza Gate 1 desktop proof"
edition = "2021"
rust-version = "1.77.2"

[features]
default = ["gate1-proof"]
gate1-proof = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
url = "2"

[dependencies]
base64 = "0.22"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tauri = { version = "2.11.1", features = ["tray-icon"] }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
url = "2"
webbrowser = "1"
zeroize = "1"
